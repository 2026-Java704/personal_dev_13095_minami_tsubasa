<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>カレンダー表示</title>
	<link rel="stylesheet" href="/css/style.css">
	<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">

</head>

<body>
	<header>
		<h1>日別利用実績</h1>
	</header>
	<div class="viewContainer">
		<div id="calendar"></div>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.15/locales-all.global.min.js"></script>
	
	<!--モーダルで詳細 ボタンはJSで発行-->
	<input type="checkbox" id="modalToggle" class="modal-checkbox">
	<div class="modal" id="modal">
	  <div class="modal-wrapper">
	    <label for="modalToggle" class="close">&times;</label>
	    <div class="modal-content">
	      <h1 id="itemTitle">例：家賃</h1>
	      <p id="itemPrice">金額・科目・詳細コメントを出す</p>
	    </div>
	  </div>
	</div>
	
	<script th:inline="javascript">
		
		document.addEventListener('DOMContentLoaded', function () {
			var calendarEl = document.getElementById('calendar');
			
			let rowItems = /*[[${items}]]*/ [];
					    
						// 表示を変数にする。
						let calenderView = rowItems.map(function(item) {
							return {
								title: item.itemName, 
								start: item.addDate,
								// HTMLに渡す情報をここで定義			
								extendedProps: {
								        itemName: item.itemName,
								        genreName: item.genre.genreName,
								        price: item.price
								      }
							};
						});

			var calendar = new FullCalendar.Calendar(calendarEl, {
				initialView: 'dayGridMonth',
				locale: 'ja',
				events: calenderView,
				
				// モーダルの展開
				eventClick: function(info) {
		      
			      // モーダルを開く（チェックボックスやlabelのfor属性を利用する場合）
			      document.getElementById('modalToggle').checked = true;
				 
				  // 変数からとってきた値をHTMLのモーダルに渡す処理
				  const GET_ITEM_NAME = info.event.extendedProps.itemName;
				
				  
				  const ITEM_TITLE = document.querySelector("#itemTitle");
				  ITEM_TITLE.innerHTML = GET_ITEM_NAME;
			    }
			});
			
			
			calendar.render();
		});
		
		
		
	</script>
</body>

</html>
